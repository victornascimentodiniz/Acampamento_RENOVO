<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campanha de Doações</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>
</head>

<body data-page="login" class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="brand-icon">
                ❤
            </div>

            <span class="eyebrow">Campanha Solidária</span>

            <h1>Campanha de Doações</h1>

            <p class="login-description">
                Juntos podemos fazer a diferença.
                Escolha abaixo como deseja acessar o sistema.
            </p>

            <div class="role-grid">

                <!-- USUÁRIO -->

                <button class="role-card role-user" id="btnUsuario">

                    <div class="role-icon">
                        👥
                    </div>

                    <div>
                        <h2>Quero Doar</h2>

                        <p>
                            Veja os itens necessários e registre sua doação.
                        </p>
                    </div>

                    <span class="role-arrow">
                        →
                    </span>

                </button>


                <!-- ADMIN -->

                <button class="role-card role-admin" id="btnAdministrador">

                    <div class="role-icon">
                        ⚙
                    </div>

                    <div>
                        <h2>Administrador</h2>

                        <p>
                            Cadastre itens e acompanhe todas as doações.
                        </p>
                    </div>

                    <span class="role-arrow">
                        →
                    </span>

                </button>

            </div>


            <!-- ÁREA DA SENHA -->

            <div class="admin-login-box" id="adminLoginBox">

                <div class="admin-login-header">

                    <div>
                        <span class="small-label">
                            ACESSO RESTRITO
                        </span>

                        <h3>Área do Administrador</h3>
                    </div>

                    <button
                        type="button"
                        class="icon-button"
                        id="fecharAdminLogin"
                        title="Fechar"
                    >
                        ✕
                    </button>

                </div>

                <form id="adminLoginForm">

                    <label for="adminPassword">
                        Senha do administrador
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Digite a senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Mostrar
                        </button>

                    </div>

                    <p class="form-error" id="loginError"></p>

                    <button
                        type="submit"
                        class="primary-button full-button"
                    >
                        Entrar no painel
                    </button>

                </form>

            </div>

            <div class="login-footer">

                <span>❤</span>

                <p>
                    Cada contribuição transforma vidas.
                </p>

            </div>

        </section>

    </main>

</body>

</html>
