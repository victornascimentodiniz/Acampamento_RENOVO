<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redefinição de senha do administrador do Acampamento RENOVO.">
    <title>Redefinir senha | Acampamento RENOVO</title>

    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="supabase-config.js"></script>
    <script defer src="app.js"></script>
</head>

<body data-page="reset-password" class="login-page">
    <header class="landing-header">
        <a class="landing-brand" href="index.html">
            <span class="landing-brand-icon">✝</span>
            <span>
                <strong>Acampamento RENOVO</strong>
                <small>Recuperação de acesso</small>
            </span>
        </a>

        <span class="landing-badge">RENOVO 2026</span>
    </header>

    <main class="login-container">
        <section class="login-card password-reset-card">
            <div class="brand-icon">🔐</div>

            <span class="eyebrow">ACESSO DO ADMINISTRADOR</span>

            <h1>Redefinir senha</h1>

            <p class="login-description">
                Digite uma nova senha para sua conta de administrador.
                O link recebido por e-mail precisa estar válido.
            </p>

            <div id="resetLoading" class="reset-status">
                Validando o link de recuperação...
            </div>

            <form id="resetPasswordForm" class="hidden-form">
                <div class="form-group">
                    <label for="resetNewPassword">Nova senha</label>
                    <input
                        type="password"
                        id="resetNewPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Mínimo de 8 caracteres"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="resetConfirmPassword">Confirmar nova senha</label>
                    <input
                        type="password"
                        id="resetConfirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        placeholder="Digite novamente a senha"
                        required
                    >
                </div>

                <p class="form-error" id="resetPasswordError"></p>

                <button
                    type="submit"
                    class="primary-button full-button"
                    id="btnResetPassword"
                >
                    Salvar nova senha
                </button>
            </form>

            <a class="back-login-link" href="index.html">
                ← Voltar para a página inicial
            </a>
        </section>
    </main>

    <div id="toast" class="toast"></div>
</body>
</html>
